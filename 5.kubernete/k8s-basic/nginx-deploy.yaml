apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpl
spec:
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25% 
      maxUnavailable: 25% 
    #type: Recreate
  replicas: 4 
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-cont
        image: nginx:latest 
       # image: 69966/earthdx:78
        resources:
          limits:
            memory: "250Mi"
            cpu: "500m"
          requests: 
            memory: "150Mi"
            cpu: "200m"
        ports:
        - containerPort: 80
