# Reactjs service 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
  labels: 
    app: myapp 
    replicas: blue 
spec:
  replicas: 4
  selector:
    matchLabels:
      app: myapp
      replicas: blue 
  template:
    metadata:
      labels:
        app: myapp
        replicas: blue 
    spec:
      containers:
      - name: reactjs-cont 
        image: 69966/earthdx:78
        ports:
        - containerPort: 80
