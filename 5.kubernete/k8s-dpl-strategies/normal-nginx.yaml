apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactjs-dpl
spec:
  selector:
    matchLabels:
      app: reactjs-app
  template:
    metadata:
      labels:
        app: reactjs-app
    spec:
      containers:
      - name: reactjs-cont 
        image: 69966/earthdx:78
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
--- 
apiVersion: v1
kind: Service
metadata:
  name: earthdx-svc
spec:
  type: NodePort
  selector:
    app: reactjs-app 
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
