apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpl
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      imagePullSecrets: 
      - name: regcred
      containers:
      - name: nginx-app
        image: nexus-oss-cr.anajak-khmer.site/nginx:alpine
        ports:
        - containerPort: 80
