apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dpl
spec:
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
      - name: postgres-app
        image: postgres:latest 
        ports:
        - containerPort: 5432
        # envFrom: 
        #     - secretRef: 
        #         name: postgres-secret1
        env: 
          - name: POSTGRES_USER 
            valueFrom: 
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD 
            valueFrom: 
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
