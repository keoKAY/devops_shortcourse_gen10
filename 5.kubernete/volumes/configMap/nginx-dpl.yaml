apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dpl
spec:
  selector:
    matchLabels:
      app: nginx-app 
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx-app
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts: 
          - name: nginx-vol 
            mountPath: /usr/share/nginx
      volumes: 
        - name: nginx-vol 
          configMap: 
            name: nginx-index-cm
            items: 
              - key: index.html
                path: html/index.html 
