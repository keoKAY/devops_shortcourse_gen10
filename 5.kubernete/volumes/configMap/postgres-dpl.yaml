apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dpl
spec:
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
    spec:
      containers:
      - name: postgres-app
        image: postgres:latest 
        ports:
        - containerPort: 5432
        env: 
        - name: POSTGRES_USER
          valueFrom: 
            configMapKeyRef: 
              name: postgres-configmap-v2
              key: PG_USER 
        - name: POSTGRES_PASSWORD
          valueFrom: 
            configMapKeyRef: 
              name: postgres-configmap-v2
              key: PG_PASS
        # envFrom:
        #   - configMapRef: 
        #       name: postgres-configmap  
