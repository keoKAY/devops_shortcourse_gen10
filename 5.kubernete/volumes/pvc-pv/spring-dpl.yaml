apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dpl
spec:
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-cont 
        image: 69966/springgradleimg:1.1.1
        ports:
        - containerPort: 8080
        volumeMounts: 
          - name: my-spring-vol 
            mountPath: /app/src/main/resources/images
      volumes: 
        - name: my-spring-vol 
          persistentVolumeClaim: 
            claimName: spring-nfs-pvc-external
