apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dpl
spec:
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      # using nodeSelector to ensure that it will run on Node1 (easier to see the folder and files )
      # nodeSelector: 
      #   kubernetes.io/hostname: "node1"
      containers:
      - name: spring-cont 
        image: 69966/springgradleimg:1.1.1
        ports:
        - containerPort: 8080
        volumeMounts: 
          - name: my-spring-vol 
            mountPath: /app/src/main/resources/images
      volumes: 
        - name: my-spring-vol 
          hostPath: 
            path: /var/images 
