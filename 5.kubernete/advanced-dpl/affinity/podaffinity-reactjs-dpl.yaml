apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactjs-app

spec:
  replicas: 10 
  selector:
    matchLabels:
      app: reactjs-app
  template:
    metadata:
      labels:
        app: reactjs-app
    spec:
    # still include node1 instead of all node4 
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - myapp
                topologyKey: kubernetes.io/hostname
      containers:
      - name: reactjs-app
        image:  69966/earthdx:78
        ports:
        - containerPort: 80
