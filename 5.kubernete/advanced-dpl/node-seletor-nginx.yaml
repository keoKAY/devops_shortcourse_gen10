apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 6
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      nodeSelector: 
      # can be any label you desired , disktype , hostname
        kubernetes.io/hostname: node4
      containers:
      - name: myapp 
        image: nginx
        ports:
        - containerPort : 80
